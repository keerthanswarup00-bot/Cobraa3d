services:
  postgres:
    image: postgres:16
    container_name: cobraa3d-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cobraa3d
    ports:
      - "5432:5432"
    volumes:
      - cobraa3d_pg:/var/lib/postgresql/data

volumes:
  cobraa3d_pg:
