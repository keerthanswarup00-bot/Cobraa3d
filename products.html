<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobraa.3D — Products</title>
<style>
  :root{
    --bg:#000; --panel:#0c0c0c; --ink:#fff; --muted:#8f8f8f; --line:rgba(255,255,255,.16); --line-strong:rgba(255,255,255,.4);
    --wa:#25d366; --radius:14px;
    --img-ratio: 4 / 5;   /* EVERY product image, everywhere. Export all photos at 1200×1500 */
    --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  body.lock{overflow:hidden}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid #fff;outline-offset:2px}

  /* ============ header ============ */
  .nav{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav-in{max-width:1320px;margin:auto;padding:0 28px;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .logo{font-weight:700;letter-spacing:-.01em}
  .nav-links{display:flex;gap:32px;font-size:14px}
  .nav-links a{color:var(--muted)} .nav-links a.on,.nav-links a:hover{color:#fff}
  .wa-top{justify-self:end;font-size:13px;border:1px solid var(--line);padding:9px 14px;border-radius:8px}
  .wa-top:hover{border-color:var(--line-strong)}

  .wrap{max-width:1320px;margin:auto;padding:0 28px}
  .head{padding:56px 0 28px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(34px,5.4vw,64px);letter-spacing:-.035em;line-height:1;margin-top:14px;font-weight:600}
  h1 span{color:var(--muted)}

  /* ============ toolbar ============ */
  .toolbar{position:sticky;top:64px;z-index:15;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:10px;align-items:center}
  .search{position:relative;flex:1;max-width:440px}
  .search input{width:100%;height:44px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:10px;background:transparent;outline:none}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:#fff}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .spacer{flex:1}
  .ctl{height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);}
  .ctl:hover{border-color:var(--line-strong)}
  select.ctl option{background:#111}
  .btn-filter{display:none;align-items:center;gap:8px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:34px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;white-space:nowrap}
  .chip small{color:var(--muted);margin-left:5px}
  .chip:hover{border-color:var(--line-strong)}
  .chip[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
  .chip[aria-pressed="true"] small{color:#555}

  /* ============ layout ============ */
  .layout{display:grid;grid-template-columns:220px 1fr;gap:44px;padding:30px 0 90px}
  .side{position:sticky;top:178px;align-self:start}
  .side h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:600}
  .side section{padding-bottom:26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
  .opt{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0;cursor:pointer}
  .opt input{accent-color:#fff;width:16px;height:16px}
  input[type=range]{width:100%;accent-color:#fff}
  .range-val{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
  .linkbtn{font-size:13px;text-decoration:underline;background:none;border:0;color:var(--muted)}
  .linkbtn:hover{color:#fff}
  .side-head{display:none}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:13px;color:var(--muted)}

  /* ============ grid + card ============ */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 18px}
  .card{display:flex;flex-direction:column;min-width:0}
  .media{position:relative;display:block;aspect-ratio:var(--img-ratio);overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:#111}
  .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s ease, transform .6s ease}
  .media .b{opacity:0}
  @media (hover:hover) and (pointer:fine){
    .card:hover .media{border-color:var(--line-strong)}
    .card:hover .media .b{opacity:1}
    .card:hover .media .a{transform:scale(1.03)}
    .media.single:hover .a{transform:scale(1.05)}
  }
  .card .info{padding:14px 2px 0;display:flex;flex-direction:column;gap:12px;flex:1}
  .title{font-size:15px;font-weight:500;line-height:1.3;letter-spacing:-.005em;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .price{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
  .view{height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;font-size:13px;display:inline-flex;align-items:center;transition:.15s}
  .view:hover{background:#fff;color:#000;border-color:#fff}

  .empty{grid-column:1/-1;text-align:center;padding:90px 0;color:var(--muted)}
  .empty b{display:block;color:#fff;font-size:18px;margin-bottom:8px}

  /* ============ pagination ============ */
  .pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:56px;flex-wrap:wrap}
  .pg{min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:14px;font-variant-numeric:tabular-nums}
  .pg:hover:not(:disabled){border-color:var(--line-strong)}
  .pg[aria-current="page"]{background:#fff;color:#000;border-color:#fff}
  .pg:disabled{opacity:.3;cursor:default}
  .dots{color:var(--muted);padding:0 4px}

  /* ============ product sheet ============ */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;
         left:0;right:0;bottom:0;max-height:92dvh;border-radius:22px 22px 0 0;border-bottom:0;
         transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
  .sheet.open{transform:none}
  .sheet.drag{transition:none}
  .grab{flex:none;padding:10px 0 6px;display:flex;justify-content:center;touch-action:none;cursor:grab}
  .grab i{width:42px;height:4px;border-radius:4px;background:var(--line-strong)}
  .close{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center}
  .close:hover{background:#fff;color:#000}
  .scroll{overflow-y:auto;overscroll-behavior:contain;flex:1}
  .gal{position:relative}
  .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
  .track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:var(--img-ratio);max-height:56dvh;background:#111}
  .slide img{width:100%;height:100%;object-fit:cover;display:block}
  .dotrow{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;pointer-events:none}
  .dotrow i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.4);transition:.25s}
  .dotrow i.on{width:20px;background:#fff}
  .arrow{display:none;position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(0,0,0,.55);backdrop-filter:blur(6px);place-items:center}
  .arrow:hover{background:#fff;color:#000}
  .arrow.l{left:12px}.arrow.r{right:12px}
  .detail{padding:20px 20px 16px}
  .cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .detail h2{font-size:24px;letter-spacing:-.02em;line-height:1.15;margin:8px 0 6px;font-weight:600}
  .detail .p{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .detail p.desc{color:#c8c8c8;line-height:1.6;font-size:15px;margin:16px 0}
  .specs{border-top:1px solid var(--line);margin:4px 0 18px}
  .specs div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
  .specs dt{color:var(--muted)} .specs dd{text-align:right}
  .field{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .note{width:100%;min-height:62px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;outline:none;font-size:14px}
  .note:focus{border-color:#fff}
  .buybar{flex:none;display:flex;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .qty{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;height:50px}
  .qty button{width:38px;height:100%;background:none;border:0;font-size:18px}
  .qty span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
  .order{flex:1;height:50px;border-radius:10px;background:var(--wa);color:#000;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px}
  .order:hover{filter:brightness(1.08)}
  .order svg{width:20px;height:20px}
  .fine{font-size:12px;color:var(--muted);text-align:center;padding:0 20px 10px}

  @media (min-width:861px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(1020px,92vw);max-height:88vh;height:min(740px,88vh);border-radius:20px;border-bottom:1px solid var(--line);
           display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:1fr auto;
           transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .25s ease;padding-bottom:0}
    .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
    .grab{display:none}
    .scroll{display:contents}
    .gal{grid-row:1/3;grid-column:1;height:100%;border-right:1px solid var(--line);background:#111;display:flex;align-items:center;border-radius:20px 0 0 20px;overflow:hidden}
    .track{width:100%;height:100%}
    .slide{max-height:none;aspect-ratio:auto;height:100%}
    .detail{grid-column:2;grid-row:1;overflow-y:auto;padding:36px 32px 16px}
    .buybar{grid-column:2;grid-row:2;padding:14px 32px 24px}
    .fine{display:none}
    .arrow{display:grid}
  }

  /* ============ mobile ============ */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;opacity:0;pointer-events:none;transition:.25s}
  @media (max-width:860px){
    .nav-in{grid-template-columns:1fr auto;padding:0 16px}
    .nav-links{display:none}
    .wrap{padding:0 16px}
    .head{padding:36px 0 20px}
    .layout{grid-template-columns:1fr;gap:0;padding-top:20px}
    .btn-filter{display:inline-flex}
    .side{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);z-index:80;background:#050505;border-right:1px solid var(--line);padding:22px;overflow:auto;transform:translateX(-102%);transition:transform .28s}
    .side.open{transform:none}
    .scrim.open{opacity:1;pointer-events:auto}
    .side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-weight:600}
    .toolbar{top:64px}
    .grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}
    .foot{flex-direction:column;align-items:stretch;gap:10px}
    .view{justify-content:center}
    .price{font-size:15px}
    .search{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="nav"><div class="nav-in">
  <a class="logo" href="#">Cobraa.3D</a>
  <nav class="nav-links"><a class="on" href="#">Products</a><a href="#">Custom</a></nav>
  <a class="wa-top" id="waTop" href="#" target="_blank" rel="noopener">Chat on WhatsApp ↗</a>
</div></header>

<div class="wrap">
  <div class="head">
    <div class="eyebrow">Objects, made differently</div>
    <h1>Thoughtful design.<br><span>Made in 3D.</span></h1>
  </div>

  <div class="toolbar">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search products…" autocomplete="off" aria-label="Search products">
      </label>
      <span class="spacer"></span>
      <button class="ctl btn-filter" id="openFilters">Filters<span id="fcount"></span></button>
      <select class="ctl" id="sort" aria-label="Sort products">
        <option value="new">Newest</option>
        <option value="plow">Price: low to high</option>
        <option value="phigh">Price: high to low</option>
        <option value="az">Name: A to Z</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </div>

  <div class="layout">
    <aside class="side" id="side" aria-label="Filters">
      <div class="side-head"><span>Filters</span><button class="linkbtn" id="closeFilters">Done</button></div>
      <section>
        <h3>Max price</h3>
        <input type="range" id="price" aria-label="Maximum price">
        <div class="range-val"><span id="priceMin"></span><span id="priceOut"></span></div>
      </section>
      <section>
        <h3>Good for</h3>
        <div id="tags"></div>
      </section>
      <button class="linkbtn" id="reset">Reset all</button>
    </aside>

    <main id="results">
      <div class="meta"><span id="count"></span><span id="pageinfo"></span></div>
      <div class="grid" id="grid"></div>
      <nav class="pager" id="pager" aria-label="Pagination"></nav>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<!-- product sheet: bottom sheet on phones, centred modal on desktop -->
<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" aria-hidden="true">
  <div class="grab" id="grab"><i></i></div>
  <button class="close" id="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="scroll">
    <div class="gal">
      <div class="track" id="track"></div>
      <button class="arrow l" id="prev" aria-label="Previous image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="arrow r" id="next" aria-label="Next image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="dotrow" id="dots"></div>
    </div>
    <div class="detail">
      <div class="cat" id="sCat"></div>
      <h2 id="sTitle"></h2>
      <div class="p" id="sPrice"></div>
      <p class="desc" id="sDesc"></p>
      <dl class="specs" id="sSpecs"></dl>
      <label class="field" for="note">Customisation or notes (optional)</label>
      <textarea class="note" id="note" placeholder="Colour, name to print, size…"></textarea>
    </div>
  </div>
  <div>
    <div class="buybar">
      <div class="qty"><button id="minus" aria-label="Decrease quantity">−</button><span id="qty">1</span><button id="plus" aria-label="Increase quantity">+</button></div>
      <a class="order" id="order" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span>Order on WhatsApp</span>
      </a>
    </div>
    <div class="fine">You'll confirm size, colour and delivery with us on WhatsApp. No payment is taken here.</div>
  </div>
</section>

<script>
/* ============================================================
   CONFIG — edit these
   ============================================================ */
const CONFIG = {
  whatsapp: "919999999999",   // country code + number, no + or spaces
  perPage: 15,
  currency: "₹",
  siteName: "Cobraa.3D",
};

/* ============================================================
   DATA — replace with your real 50+ products.
   Each product: id, name, cat, tags[], price, desc, specs{}, images[3-4]
   ============================================================ */
function ph(hue,label,n){            // placeholder, all 800×1000 (4:5)
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},28%,24%)"/><stop offset="1" stop-color="hsl(${(hue+40)%360},30%,11%)"/></linearGradient></defs><rect width="800" height="1000" fill="url(#g)"/><circle cx="${300+n*60}" cy="${420+n*20}" r="${130+n*18}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"/><text x="400" y="900" fill="rgba(255,255,255,.4)" font-family="sans-serif" font-size="26" text-anchor="middle">${label.replace(/&/g,'&amp;')} · image ${n+1}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}
const CATS={"Colouring Sets":[20,"Print-and-paint pieces with clean outlines, sized for small hands. Comes ready to colour with any marker or acrylic."],
            "Charms":[290,"Small, lightweight charms with a smooth finish and a metal ring. Good for bags, keys and zips."],
            "Lighting":[45,"Diffused 3D-printed shade that spreads a warm, even glow. Works with a standard warm-white LED bulb."],
            "Keepsakes":[200,"A personal piece made around your details. We confirm the design with you before printing."],
            "Desk & Decor":[160,"Everyday objects designed to sit tidily on a desk or shelf, printed for strength as well as looks."]};
const BASE=[
 ["Kawaii Monster Charm Collection","Charms",499,["Kids","Gifts"]],["Mini Cactus Keychain","Charms",249,["Gifts"]],["Pixel Heart Keychain","Charms",199,["Gifts"]],
 ["Cloud Bag Charm","Charms",299,["Kids","Gifts"]],["Retro Camera Charm","Charms",349,["Gifts"]],["Tiny Octopus Charm","Charms",249,["Kids"]],
 ["Four-Piece Dinosaur Colouring Set","Colouring Sets",699,["Kids","Gifts"]],["Ocean Friends Colouring Set","Colouring Sets",649,["Kids"]],
 ["Space Explorer Colouring Set","Colouring Sets",699,["Kids","Gifts"]],["Farm Animals Colouring Set","Colouring Sets",599,["Kids"]],["Jungle Pals Colouring Set","Colouring Sets",649,["Kids","Gifts"]],
 ["Pleated Tulip Lamp","Lighting",1899,["Home","Gifts"]],["Wave Table Lamp","Lighting",1999,["Home","Gifts"]],["Faceted Geometric Lamp","Lighting",2199,["Home"]],
 ["Spiral Night Light","Lighting",1299,["Home","Kids"]],["Cloud Mood Light","Lighting",1499,["Home","Kids"]],
 ["Marathon Medal Display with Rocket Figurine","Keepsakes",2499,["Gifts","Home"]],["Custom Name Plaque","Keepsakes",899,["Gifts","Home"]],
 ["Topographic Map Frame","Keepsakes",2299,["Gifts","Home"]],["Birth Details Frame","Keepsakes",1799,["Gifts"]],["Wedding Date Sign","Keepsakes",1999,["Gifts","Home"]],
 ["Cable Organiser Stand","Desk & Decor",449,["Home"]],["Phone Dock Stand","Desk & Decor",549,["Home"]],["Geometric Planter Pot","Desk & Decor",799,["Home","Gifts"]],
 ["Hex Pen Cup","Desk & Decor",399,["Home"]],["Headphone Holder","Desk & Decor",899,["Home"]],
];
const PRODUCTS=[...BASE,...BASE.map(([n,c,p,t])=>[n+" (Large)",c,Math.round(p*1.4/50)*50,t])].map(([name,cat,price,tags],i)=>{
  const [hue,desc]=CATS[cat];
  return {id:i+1,name,cat,tags,price,
    desc:desc+" Printed to order in Bengaluru, so each piece is made fresh for you.",
    specs:{Material:"PLA / PETG",Finish:"Hand-finished","Made in":"3–5 working days"},
    images:[0,1,2,3].map(n=>ph((hue+i*7)%360,name,n))};
});

/* ============================================================
   APP
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>CONFIG.currency+n.toLocaleString("en-IN");
const cats=["All",...new Set(PRODUCTS.map(p=>p.cat))];
const tagList=[...new Set(PRODUCTS.flatMap(p=>p.tags))];
const maxP=Math.max(...PRODUCTS.map(p=>p.price)), minP=Math.min(...PRODUCTS.map(p=>p.price));
const S={q:"",cat:"All",tags:new Set(),max:maxP,sort:"new",page:1};

$("#waTop").href=`https://wa.me/${CONFIG.whatsapp}`;
$("#price").min=Math.floor(minP/100)*100; $("#price").max=maxP; $("#price").step=50; $("#price").value=maxP;
$("#priceMin").textContent=money(+$("#price").min);

/* ---------- filtering ---------- */
function filtered(){
  const by={new:(a,b)=>b.id-a.id, az:(a,b)=>a.name.localeCompare(b.name), plow:(a,b)=>a.price-b.price, phigh:(a,b)=>b.price-a.price};
  return PRODUCTS.filter(p=>
    (S.cat==="All"||p.cat===S.cat) &&
    (!S.q||(p.name+" "+p.cat+" "+p.tags.join(" ")).toLowerCase().includes(S.q)) &&
    (!S.tags.size||[...S.tags].every(t=>p.tags.includes(t))) &&
    p.price<=S.max).sort(by[S.sort]);
}

/* ---------- render grid ---------- */
function render(scroll){
  const list=filtered(), pages=Math.max(1,Math.ceil(list.length/CONFIG.perPage));
  S.page=Math.min(S.page,pages);
  const start=(S.page-1)*CONFIG.perPage, slice=list.slice(start,start+CONFIG.perPage);
  $("#count").textContent=`${list.length} product${list.length===1?"":"s"}`;
  $("#pageinfo").textContent=list.length?`Page ${S.page} of ${pages}`:"";
  $("#priceOut").textContent=S.max>=maxP?"Any":"Up to "+money(S.max);
  const active=(S.tags.size)+(S.max<maxP?1:0);
  $("#fcount").textContent=active?` · ${active}`:"";
  $("#grid").innerHTML=slice.length?slice.map((p,i)=>{
    const two=p.images.length>1;
    return `<article class="card">
      <a class="media ${two?"":"single"}" href="#/p/${p.id}" data-id="${p.id}" aria-label="View ${esc(p.name)}">
        <img class="a" src="${p.images[0]}" alt="${esc(p.name)}" loading="${i<4?"eager":"lazy"}" width="800" height="1000">
        ${two?`<img class="b" src="${p.images[1]}" alt="" aria-hidden="true" loading="lazy" width="800" height="1000">`:""}
      </a>
      <div class="info">
        <h2 class="title">${esc(p.name)}</h2>
        <div class="foot"><span class="price">${money(p.price)}</span><a class="view" href="#/p/${p.id}" data-id="${p.id}">View</a></div>
      </div></article>`}).join("")
    :`<div class="empty"><b>Nothing matches that.</b>Try a different word or <button class="linkbtn" id="emptyReset">reset the filters</button>.</div>`;
  renderPager(pages);
  if(scroll){const t=$("#results").getBoundingClientRect().top+scrollY-150;scrollTo({top:Math.min(t,scrollY),behavior:"smooth"})}
  try{const u=new URL(location.href);S.page>1?u.searchParams.set("page",S.page):u.searchParams.delete("page");history.replaceState(history.state,"",u)}catch(e){}
}
function renderPager(pages){
  const el=$("#pager"); if(pages<=1){el.innerHTML="";return}
  const set=new Set([1,pages,S.page,S.page-1,S.page+1]); if(S.page<=3)[2,3].forEach(n=>set.add(n)); if(S.page>=pages-2)[pages-1,pages-2].forEach(n=>set.add(n));
  const nums=[...set].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);
  let h=`<button class="pg" data-go="${S.page-1}" ${S.page===1?"disabled":""} aria-label="Previous page">←</button>`,prev=0;
  nums.forEach(n=>{if(n-prev>1)h+=`<span class="dots">…</span>`;h+=`<button class="pg" data-go="${n}" ${n===S.page?'aria-current="page"':""}>${n}</button>`;prev=n});
  h+=`<button class="pg" data-go="${S.page+1}" ${S.page===pages?"disabled":""} aria-label="Next page">→</button>`;
  el.innerHTML=h;
}
$("#pager").onclick=e=>{const b=e.target.closest("[data-go]");if(!b||b.disabled)return;S.page=+b.dataset.go;render(true)};

/* ---------- controls ---------- */
function renderChips(){
  $("#chips").innerHTML=cats.map(c=>{const n=c==="All"?PRODUCTS.length:PRODUCTS.filter(p=>p.cat===c).length;
    return `<button class="chip" data-c="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}<small>${n}</small></button>`}).join("");
}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S.cat=b.dataset.c;S.page=1;renderChips();render()};
$("#tags").innerHTML=tagList.map(t=>`<label class="opt"><input type="checkbox" value="${t}"> ${t}</label>`).join("");
$("#tags").onchange=e=>{e.target.checked?S.tags.add(e.target.value):S.tags.delete(e.target.value);S.page=1;render()};
let tm;$("#q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();S.page=1;render()},140)};
$("#sort").onchange=e=>{S.sort=e.target.value;S.page=1;render()};
$("#price").oninput=e=>{S.max=+e.target.value;S.page=1;render()};
function resetAll(){Object.assign(S,{q:"",cat:"All",max:maxP,sort:"new",page:1});S.tags.clear();
  $("#q").value="";$("#price").value=maxP;$("#sort").value="new";document.querySelectorAll("#tags input").forEach(i=>i.checked=false);renderChips();render()}
$("#reset").onclick=resetAll;
$("#grid").addEventListener("click",e=>{if(e.target.id==="emptyReset")resetAll()});
const drawer=o=>{$("#side").classList.toggle("open",o);$("#scrim").classList.toggle("open",o)};
$("#openFilters").onclick=()=>drawer(true);$("#closeFilters").onclick=()=>drawer(false);$("#scrim").onclick=()=>drawer(false);

/* ---------- product sheet ---------- */
const sheet=$("#sheet"),overlay=$("#overlay"),track=$("#track");
let cur=null,qty=1,lastFocus=null,pushed=false;

function openProduct(id,fromHash){
  const p=PRODUCTS.find(x=>x.id==id); if(!p)return;
  cur=p;qty=1;$("#qty").textContent=1;$("#note").value="";
  lastFocus=document.activeElement;
  $("#sCat").textContent=p.cat;$("#sTitle").textContent=p.name;$("#sPrice").textContent=money(p.price);$("#sDesc").textContent=p.desc;
  $("#sSpecs").innerHTML=Object.entries(p.specs).map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  track.innerHTML=p.images.map((s,i)=>`<div class="slide"><img src="${s}" alt="${esc(p.name)} — image ${i+1} of ${p.images.length}" ${i?'loading="lazy"':""} draggable="false"></div>`).join("");
  $("#dots").innerHTML=p.images.length>1?p.images.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join(""):"";
  document.querySelectorAll(".arrow").forEach(a=>a.style.visibility=p.images.length>1?"":"hidden");
  track.scrollLeft=0;updateOrder();
  sheet.style.transform="";sheet.classList.remove("drag");
  overlay.classList.add("open");sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");document.body.classList.add("lock");
  sheet.querySelector(".scroll").scrollTop=0;
  if(!fromHash){try{history.pushState({sheet:p.id},"","#/p/"+p.id);pushed=true}catch(e){}}
  setTimeout(()=>$("#close").focus({preventScroll:true}),50);
}
function closeProduct(fromPop){
  if(!cur)return; cur=null;
  overlay.classList.remove("open");sheet.classList.remove("open");sheet.style.transform="";sheet.setAttribute("aria-hidden","true");document.body.classList.remove("lock");
  if(!fromPop){ if(pushed){pushed=false;history.back()} else {try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}} }
  else pushed=false;
  lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});
}
document.addEventListener("click",e=>{const a=e.target.closest("[data-id]");if(a){e.preventDefault();openProduct(a.dataset.id)}});
$("#close").onclick=()=>closeProduct();overlay.onclick=()=>closeProduct();
addEventListener("keydown",e=>{
  if(!cur)return;
  if(e.key==="Escape")closeProduct();
  if(e.key==="ArrowRight")go(1); if(e.key==="ArrowLeft")go(-1);
});
addEventListener("popstate",()=>{const m=location.hash.match(/^#\/p\/(\d+)/);m?openProduct(m[1],true):closeProduct(true)});

/* gallery: swipe is native scroll-snap; dots follow position */
function idx(){return Math.round(track.scrollLeft/track.clientWidth)}
function go(d){const n=cur.images.length,i=Math.max(0,Math.min(n-1,idx()+d));track.scrollTo({left:i*track.clientWidth,behavior:"smooth"})}
$("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
track.addEventListener("scroll",()=>{const i=idx();document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i))},{passive:true});

/* quantity + WhatsApp message */
function updateOrder(){
  if(!cur)return;
  const note=$("#note").value.trim();
  const lines=[`Hi ${CONFIG.siteName}, I'd like to order:`,"",`• ${cur.name} (#${cur.id})`,`• Qty: ${qty}`,`• Price: ${money(cur.price)} each · ${money(cur.price*qty)} total`];
  if(note)lines.push(`• Notes: ${note}`);
  lines.push("","Please confirm availability and delivery time.");
  $("#order").href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(lines.join("\n"))}`;
  $("#order span").textContent=qty>1?`Order ${qty} on WhatsApp · ${money(cur.price*qty)}`:"Order on WhatsApp";
}
$("#minus").onclick=()=>{qty=Math.max(1,qty-1);$("#qty").textContent=qty;updateOrder()};
$("#plus").onclick=()=>{qty=Math.min(20,qty+1);$("#qty").textContent=qty;updateOrder()};
$("#note").oninput=updateOrder;

/* drag the sheet down to close (phones) */
(function(){
  const grab=$("#grab");let y0=null,dy=0;
  grab.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;sheet.classList.add("drag")},{passive:true});
  grab.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform=`translateY(${dy}px)`},{passive:true});
  grab.addEventListener("touchend",()=>{if(y0==null)return;sheet.classList.remove("drag");y0=null;
    if(dy>110)closeProduct(); else sheet.style.transform=""});
})();

/* ---------- boot ---------- */
(function(){
  try{const pg=+new URL(location.href).searchParams.get("page");if(pg>0)S.page=pg}catch(e){}
  renderChips();render();
  const m=location.hash.match(/^#\/p\/(\d+)/); if(m)openProduct(m[1],true);
})();
</script>
</body>
</html>
